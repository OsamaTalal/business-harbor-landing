# لوحة تحكم مرسى الأعمال — كل تعديل يتحفظ في GitHub (فرع cms)
# وبعدها الصفحة بتتبني وتتنشر لوحدها خلال دقيقة أو اتنين.
backend:
  name: github
  repo: OsamaTalal/business-harbor-landing
  branch: cms
  commit_messages:
    update: 'تعديل {{slug}} من لوحة التحكم'
    uploadMedia: 'رفع {{path}}'
    deleteMedia: 'حذف {{path}}'

media_folder: media/uploads
public_folder: /media/uploads

collections:
  - name: site
    label: محتوى الصفحة
    editor:
      preview: false
    files:

      # ---------------- Videos ----------------
      - name: videos
        label: 🎬 فيديوهات تجارب العملاء
        file: content/videos.json
        fields:
          - name: videos
            label: الفيديوهات
            label_singular: فيديو
            widget: list
            summary: '{{fields.title_ar}}'
            hint: رتّب الفيديوهات بالسحب. لو أكتر من 3 بيظهروا كسلايدر بيلف لوحده.
            fields:
              - { name: title_ar, label: 'العنوان (عربي)', widget: string }
              - { name: title_en, label: 'Title (English)', widget: string, required: false }
              - { name: title_tr, label: 'Başlık (Türkçe)', widget: string, required: false }
              - { name: who_ar, label: 'اسم العميل ونشاطه (عربي)', widget: string, required: false }
              - { name: who_en, label: 'Client name & business (English)', widget: string, required: false }
              - { name: who_tr, label: 'Müşteri adı ve faaliyeti (Türkçe)', widget: string, required: false }
              - name: youtube
                label: رابط يوتيوب
                widget: string
                required: false
                hint: 'مثال: https://www.youtube.com/watch?v=xxxx أو رابط Shorts. لو حطيت رابط يوتيوب مش محتاج ترفع فيديو.'
              - name: mp4
                label: أو ارفع فيديو MP4
                widget: file
                required: false
                media_folder: /media/videos
                public_folder: /media/videos
                accept: video/mp4,video/quicktime
                hint: 'أقصى حجم 30 ميجا. الفيديو بيتضغط أوتوماتيك. يوتيوب أفضل للفيديوهات الطويلة.'
              - name: poster
                label: صورة الغلاف (اختياري)
                widget: image
                required: false
                media_folder: /media/posters
                public_folder: /media/posters
                hint: 'لو سبتها فاضية: بتتاخد صورة يوتيوب أو أول لقطة من الفيديو.'

      # ---------------- Logos ----------------
      - name: logos
        label: 🏢 شركات وثقت بنا (اللوجوهات)
        file: content/logos.json
        fields:
          - name: logos
            label: اللوجوهات
            label_singular: لوجو
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: image, label: اللوجو, widget: image, media_folder: /media/logos, public_folder: /media/logos, hint: 'يفضل PNG أو WebP بخلفية شفافة أو بيضاء.' }
              - { name: name, label: 'اسم الشركة (عربي)', widget: string }
              - { name: name_en, label: 'Company name (English / Türkçe)', widget: string, required: false }

      # ---------------- Proof photos ----------------
      - name: proof
        label: 📸 صور العملاء (موثوقون من قِبل المستثمرين)
        file: content/proof.json
        fields:
          - name: photos
            label: الصور
            label_singular: صورة
            widget: list
            summary: '{{fields.image}}'
            hint: صور طولية أفضل (3:4).
            fields:
              - { name: image, label: الصورة, widget: image, media_folder: /media/proof, public_folder: /media/proof }

      # ---------------- Google reviews ----------------
      - name: reviews
        label: ⭐ تقييمات جوجل
        file: content/reviews.json
        fields:
          - name: reviews
            label: التقييمات
            label_singular: تقييم
            widget: list
            summary: '{{fields.name}}'
            fields:
              - { name: name, label: 'اسم صاحب التقييم (زي ما هو على جوجل)', widget: string }
              - { name: name_latin, label: 'الاسم بحروف إنجليزي (للصفحة الإنجليزي والتركي)', widget: string, required: false }
              - { name: stars, label: عدد النجوم, widget: number, value_type: int, min: 1, max: 5, default: 5 }
              - { name: text_ar, label: 'نص التقييم في الصفحة العربي (الأصلي)', widget: text }
              - { name: text_en, label: 'Review text (English)', widget: text, required: false }
              - { name: text_tr, label: 'Yorum metni (Türkçe)', widget: text, required: false }
              - { name: link, label: رابط التقييم على جوجل, widget: string, required: false }

      # ---------------- FAQ ----------------
      - name: faq
        label: ❓ الأسئلة الشائعة
        file: content/faq.json
        fields:
          - name: items
            label: الأسئلة
            label_singular: سؤال
            widget: list
            summary: '{{fields.q_ar}}'
            fields:
              - { name: q_ar, label: 'السؤال (عربي)', widget: string }
              - { name: a_ar, label: 'الإجابة (عربي)', widget: text }
              - { name: q_en, label: 'Question (English)', widget: string, required: false }
              - { name: a_en, label: 'Answer (English)', widget: text, required: false }
              - { name: q_tr, label: 'Soru (Türkçe)', widget: string, required: false }
              - { name: a_tr, label: 'Cevap (Türkçe)', widget: text, required: false }

      # ---------------- Main images ----------------
      - name: images
        label: 🖼️ الصور الرئيسية
        file: content/images.json
        fields:
          - { name: hero, label: 'صورة الهيرو (أول الصفحة)', widget: image, media_folder: /media/images, public_folder: /media/images, hint: 'صورة عريضة (حوالي 2100×940). على الموبايل بيتقص جزء منها أوتوماتيك.' }
          - { name: riyadh, label: 'صورة قسم "كل ما تحتاجه"', widget: image, media_folder: /media/images, public_folder: /media/images }
          - { name: why_ar, label: 'صورة "تأسيس الشركة والاستثمار" — عربي', widget: image, media_folder: /media/images, public_folder: /media/images }
          - { name: why_en, label: 'Company Formation image — English', widget: image, required: false, media_folder: /media/images, public_folder: /media/images }
          - { name: why_tr, label: 'Şirket Kuruluşu görseli — Türkçe', widget: image, required: false, media_folder: /media/images, public_folder: /media/images }

      # ---------------- Settings ----------------
      - name: settings
        label: ⚙️ الأرقام والتواصل
        file: content/settings.json
        fields:
          - { name: whatsapp, label: 'رقم واتساب (أرقام بس بكود الدولة)', widget: string, hint: 'مثال: 905541238888' }
          - { name: phone_display, label: 'الرقم زي ما يظهر في الصفحة', widget: string, hint: 'مثال: +90 554 123 8888' }
          - { name: stat_companies, label: 'عدد الشركات اللي اتأسست', widget: number, value_type: int, min: 0 }
          - { name: stat_licenses, label: 'عدد التراخيص', widget: number, value_type: int, min: 0 }
          - { name: stat_countries, label: 'عدد الدول', widget: number, value_type: int, min: 0 }
          - { name: stat_years, label: 'سنوات الخبرة', widget: number, value_type: int, min: 0 }
          - { name: stat_partnerships, label: 'التعاونات الدولية', widget: number, value_type: int, min: 0 }
