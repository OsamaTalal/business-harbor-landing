.card{width:100%;max-width:560px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:28px;padding:44px 40px 36px;text-align:center;box-shadow:0 34px 70px -34px rgba(38,72,138,.55);position:relative;overflow:hidden;animation:in .8s var(--ease) both}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:5px;background:linear-gradient(to left,var(--purple),var(--navy))}
@keyframes in{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
.ok{width:84px;height:84px;border-radius:50%;background:var(--lav);color:var(--purple);display:inline-flex;align-items:center;justify-content:center;margin-bottom:22px;box-shadow:0 0 0 10px rgba(230,218,245,.45)}
.ok svg{width:40px;height:40px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:30;stroke-dashoffset:30;animation:draw .6s .35s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
h1{margin:0;font-size:clamp(24px,3.4vw,32px);line-height:1.4;font-weight:700;color:var(--ink)}
p{margin:14px auto 0;font-size:17px;line-height:1.9;color:var(--muted);max-width:440px}
.actions{display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:30px}
.btn-cta{position:relative;overflow:hidden;isolation:isolate;display:inline-flex;align-items:center;justify-content:center;gap:12px;min-height:54px;padding:0 30px;border-radius:999px;background:var(--purple);color:#fff;font-family:var(--f);font-weight:600;font-size:16px;text-decoration:none;box-shadow:0 12px 28px -12px rgba(110,50,135,.65);transition:background-color .35s ease,box-shadow .35s ease,transform .3s var(--ease)}
.btn-cta>*{position:relative;z-index:1}
.btn-cta svg{width:22px;height:22px;flex:none;fill:currentColor;transition:transform .45s var(--ease)}
